services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: quantagent:1.0.0
    container_name: quantagent-dashboard
    ports:
      - "8007:8007"
    environment:
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data:ro
      - ./results:/app/results
      - ./docs:/app/docs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8007/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: quantagent:1.0.0
    container_name: quantagent-api
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data:ro
      - ./results:/app/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: quantagent-n8n
    profiles: ["workflow"]
    ports:
      - "5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: Africa/Casablanca
      TZ: Africa/Casablanca
      QUANTAGENT_API_URL: http://api:8000/ask
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  n8n_data:
